name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: sqlite3, pdo_sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Write production .env
        run: |
          cat > .env <<EOF
          APP_NAME="ゴルフ場検索"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          DB_CONNECTION=sqlite
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          DMM_API_ID=${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID=${{ secrets.DMM_AFFILIATE_ID }}
          DUGA_APP_ID=${{ secrets.DUGA_APP_ID }}
          DUGA_AGENT_ID=${{ secrets.DUGA_AGENT_ID }}
          SOKMIL_API_KEY=${{ secrets.SOKMIL_API_KEY }}
          SOKMIL_AFFILIATE_ID=${{ secrets.SOKMIL_AFFILIATE_ID }}
          GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}
          EOF

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude="tests" --exclude="database/database.sqlite" --exclude="storage/app" --exclude="storage/logs" --exclude="storage/framework"
          path: ./
          remote_path: ${{ secrets.XSERVER_DEPLOY_PATH }}
          remote_host: ${{ secrets.XSERVER_SSH_HOST }}
          remote_port: ${{ secrets.XSERVER_SSH_PORT }}
          remote_user: ${{ secrets.XSERVER_SSH_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Run migrations, cache config, sync content
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.XSERVER_SSH_HOST }}
          port: ${{ secrets.XSERVER_SSH_PORT }}
          username: ${{ secrets.XSERVER_SSH_USER }}
          key: ${{ secrets.XSERVER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.XSERVER_DEPLOY_PATH }}"
            mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app
            touch database/database.sqlite
            chmod -R 775 storage database
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo 'no sync command for this app'
            echo 'no cron needed'
